<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Swath &middot; Animated satellite imagery</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Cpath d='M5 21 Q16 9 27 21' fill='none' stroke='%233fa7ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='8' r='2.5' fill='%23e6edf3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <header>
        <h1>Swath</h1>
        <p class="subtitle">Animated satellite imagery</p>
      </header>

      <section class="controls">
        <label for="satellite">Satellite</label>
        <select id="satellite"></select>

        <label for="sector">Sector</label>
        <select id="sector"></select>

        <label for="product">Product</label>
        <select id="product"></select>

        <div class="row">
          <div class="col">
            <label for="frames">Frames</label>
            <input id="frames" type="number" min="1" max="100" value="24" />
          </div>
          <div class="col">
            <label for="step">Time Step</label>
            <select id="step"></select>
          </div>
        </div>

        <div id="duration" class="duration"></div>

        <label for="loop-style">Loop</label>
        <select id="loop-style">
          <option value="forward">Forward</option>
          <option value="reverse">Reverse</option>
          <option value="rock">Rock</option>
        </select>

        <label class="checkbox"><input id="auto-refresh" type="checkbox" /> Auto-refresh</label>

        <label for="speed">Speed <span id="speed-label"></span></label>
        <input id="speed" type="range" min="30" max="600" step="10" value="150" />

        <label for="rotation">Rotation <span id="rotation-label"></span></label>
        <input id="rotation" type="range" min="-180" max="180" step="15" value="0" />
      </section>

      <section class="playback">
        <button id="play" type="button">Play</button>
        <div id="status" class="status">Loading&hellip;</div>
        <div id="timestamp" class="timestamp"></div>
        <div id="memory" class="memory"></div>
      </section>

      <footer>
        <p class="attribution">
          Satellite imagery courtesy of
          <a href="https://rammb-slider.cira.colostate.edu/" target="_blank" rel="noopener">CIRA/RAMMB</a>.
        </p>
        <p class="disclaimer">
          An independent project. Not affiliated with or endorsed by CIRA, RAMMB,
          NOAA, NWS, or Colorado State University.
        </p>
      </footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div class="map-zoom">
        <div class="map-zoom-bar">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        </div>
        <button id="max-zoom" type="button" aria-label="Max zoom to a point"
                title="Max zoom, then click a point on the map">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="10" cy="10" r="6"></circle>
              <line x1="14.5" y1="14.5" x2="20" y2="20"></line>
              <line x1="10" y1="7.5" x2="10" y2="12.5"></line>
              <line x1="7.5" y1="10" x2="12.5" y2="10"></line>
            </g>
          </svg>
        </button>
      </div>
    </main>
    <div id="loading" class="loading-indicator" hidden aria-hidden="true"></div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
