<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Swath &middot; Animated satellite imagery</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Cpath d='M5 21 Q16 9 27 21' fill='none' stroke='%233fa7ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='8' r='2.5' fill='%23e6edf3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <header>
        <h1>Swath</h1>
        <p class="subtitle">Animated satellite imagery</p>
      </header>

      <section class="playback">
        <div class="play-row">
          <button id="play" type="button">Play</button>
          <select id="loop-style" aria-label="Loop style">
            <option value="forward">Forward</option>
            <option value="reverse">Reverse</option>
            <option value="rock">Rock</option>
          </select>
        </div>
      </section>

      <!-- Frame scrubber + step buttons. -->
      <section class="scrubber-bar">
        <input id="scrubber" type="range" min="0" max="100" value="100"
               aria-label="Frame scrubber" />
        <div class="btn-row">
          <!-- Auto-refresh styled as a toggle button (the checkbox stays for the app.js wiring). -->
          <label class="btn toggle" title="Auto-refresh">
            <input id="auto-refresh" type="checkbox" /> Auto &#8635;
          </label>
          <button id="prev" class="btn" type="button" title="Previous frame">&#9664; Prev</button>
          <button id="next" class="btn" type="button" title="Next frame">Next &#9654;</button>
        </div>
      </section>

      <section class="controls">
        <label for="satellite">Satellite</label>
        <select id="satellite"></select>

        <label for="sector">Sector</label>
        <select id="sector"></select>

        <label for="product">Product</label>
        <select id="product"></select>

        <div class="row">
          <div class="col">
            <label for="frames">Frames</label>
            <input id="frames" type="number" min="1" max="100" value="24" />
          </div>
          <div class="col">
            <label for="step">Time Step</label>
            <select id="step"></select>
          </div>
        </div>

        <label>Begin</label>
        <div class="row">
          <div class="col"><input id="begin-date" type="date" aria-label="Begin date" /></div>
          <div class="col"><input id="begin-time" type="time" aria-label="Begin time" /></div>
        </div>

        <label>End</label>
        <div class="row">
          <div class="col"><input id="end-date" type="date" aria-label="End date" /></div>
          <div class="col"><input id="end-time" type="time" aria-label="End time" /></div>
        </div>

        <label for="speed">Speed <span id="speed-label"></span></label>
        <input id="speed" type="range" min="30" max="600" step="10" value="100" />

        <label for="rotation">Rotation <span id="rotation-label"></span></label>
        <input id="rotation" type="range" min="-180" max="180" step="15" value="0" />
      </section>

      <!-- Layers & overlays (mocked) ------------------------------------------ -->
      <section class="controls mock-group">
        <label for="overlay">Overlays</label>
        <select id="overlay" class="mock" title="Mock — not yet wired">
          <option>Add Overlay…</option>
          <option>State / County Borders</option>
          <option>Cities</option>
          <option>Roads</option>
          <option>Lat/Lon Grid</option>
        </select>

        <label for="basemap">Base Map</label>
        <select id="basemap" class="mock" title="Mock — not yet wired">
          <option>Add Map…</option>
          <option>Street</option>
          <option>Satellite</option>
          <option>Terrain</option>
          <option>Dark</option>
        </select>

        <div class="subpanel mock">
          <div class="subpanel-head">
            <span class="subpanel-title">Lat/Lon Grid</span>
            <label class="checkbox inline"><input type="checkbox" /> Hide</label>
            <button class="close" type="button" title="Mock — not yet wired" aria-label="Remove">&times;</button>
          </div>
          <div class="row">
            <div class="col">
              <label for="grid-color">Color</label>
              <select id="grid-color">
                <option>White</option>
                <option>Black</option>
                <option>Red</option>
                <option>Yellow</option>
              </select>
            </div>
            <div class="col">
              <label for="grid-opacity">Opacity</label>
              <input id="grid-opacity" type="range" min="0" max="100" value="100" />
            </div>
          </div>
        </div>

        <div class="subpanel mock">
          <div class="subpanel-head">
            <span class="subpanel-title">Product Opacity</span>
            <label class="checkbox inline"><input type="checkbox" /> Hide</label>
            <button class="close" type="button" title="Mock — not yet wired" aria-label="Remove">&times;</button>
          </div>
          <input type="range" min="0" max="100" value="100" aria-label="Product opacity" />
          <button class="btn" type="button" title="Mock — not yet wired">Info</button>
        </div>
      </section>

      <!-- Tools & links (mocked) ---------------------------------------------- -->
      <section class="controls mock-group">
        <div class="btn-row">
          <button class="btn mock" type="button" title="Mock — not yet wired">Query Lat/Lon</button>
          <button class="btn mock" type="button" title="Mock — not yet wired">Download</button>
        </div>
        <div class="btn-row">
          <button class="btn mock" type="button" title="Mock — not yet wired">Mouse Draw</button>
          <button class="btn mock" type="button" title="Mock — not yet wired">Clear Drawings</button>
        </div>
        <label class="checkbox"><input id="follow-feature" type="checkbox" class="mock" /> Follow Feature</label>
        <div class="btn-row">
          <button class="btn mock" type="button" title="Mock — not yet wired">Hide</button>
          <button class="btn mock" type="button" title="Mock — not yet wired">Clear</button>
        </div>
      </section>

      <!-- Status readouts: loop length, frame count, available zoom levels, time, memory. -->
      <section class="info mock-group">
        <div id="status" class="status">Loading&hellip;</div>
        <div id="duration" class="duration"></div>
        <div id="timestamp" class="timestamp"></div>
        <div id="memory" class="memory"></div>
      </section>

      <footer>
        <p class="attribution">
          Satellite imagery courtesy of
          <a href="https://rammb-slider.cira.colostate.edu/" target="_blank" rel="noopener">CIRA/RAMMB</a>.
        </p>
        <p class="disclaimer">
          An independent project. Not affiliated with or endorsed by CIRA, RAMMB,
          NOAA, NWS, or Colorado State University.
        </p>
      </footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div class="map-zoom">
        <div class="map-zoom-bar">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        </div>
        <button id="max-zoom" type="button" aria-label="Max zoom to a point"
                title="Max zoom, then click a point on the map">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="10" cy="10" r="6"></circle>
              <line x1="14.5" y1="14.5" x2="20" y2="20"></line>
              <line x1="10" y1="7.5" x2="10" y2="12.5"></line>
              <line x1="7.5" y1="10" x2="12.5" y2="10"></line>
            </g>
          </svg>
        </button>
      </div>
    </main>
    <div id="loading" class="loading-indicator" hidden aria-hidden="true"></div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
